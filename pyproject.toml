[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thingsmeg"
version = "0.1.0"
description = "Temporal dynamics of cross-subject representational alignment in human MEG, and its correspondence to vision-model hierarchies."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

# Dependencies are managed via environment.yml (conda + pip). This block exists
# so the local package installs cleanly with `pip install -e .` and so tools can
# discover the src/ layout. It intentionally does not re-pin scientific deps.
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
